services:
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - studio-data:/data
      - studio-media:/media
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  studio-data:
  studio-media:
